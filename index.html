<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04191F">
<meta name="format-detection" content="telephone=no">

<title>Chácaras em São José dos Campos | Paraíso das Águas — 2 hectares com lago e água mineral</title>
<meta name="description" content="Chácaras de 20 mil m² com lago central compartilhado, água mineral, asfalto, fibra óptica e energia trifásica, a 20 min do centro de São José dos Campos e a 2 km da Represa Jaguari.">
<meta name="keywords" content="chácara à venda São José dos Campos, terreno com lago, sítio São José dos Campos, chácara com água mineral, represa jaguari jetski">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="/">

<!-- Open Graph / redes -->
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Paraíso das Águas">
<meta property="og:title" content="Chácaras em São José dos Campos | Paraíso das Águas">
<meta property="og:description" content="2 hectares com lago central entre os terrenos, água mineral e infraestrutura completa, a cerca de 20 min do centro e a 2 km da Represa Jaguari. Financiamento direto.">
<meta property="og:url" content="/">
<meta property="og:image" content="/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<!-- Favicon -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- Fontes: Cormorant Garamond (títulos) + Outfit (texto) + Quicksand (rótulos)
     preconnect + display=swap para não bloquear o LCP -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&family=Quicksand:wght@500;600&display=swap">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap">
</noscript>

<!-- Dados estruturados básicos -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Residence",
  "name": "Paraíso das Águas",
  "description": "Comunidade de chácaras de 20 mil m² com lago central compartilhado, água mineral, asfalto, fibra óptica e energia trifásica, a cerca de 20 minutos do centro de São José dos Campos.",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "São José dos Campos",
    "addressRegion": "SP",
    "addressCountry": "BR"
  },
  "amenityFeature": [
    { "@type": "LocationFeatureSpecification", "name": "Lago central compartilhado entre os terrenos" },
    { "@type": "LocationFeatureSpecification", "name": "Represa Jaguari a 2 km (jetski e esportes náuticos)" },
    { "@type": "LocationFeatureSpecification", "name": "Água mineral e nascente" },
    { "@type": "LocationFeatureSpecification", "name": "Fibra óptica" },
    { "@type": "LocationFeatureSpecification", "name": "Energia trifásica" },
    { "@type": "LocationFeatureSpecification", "name": "Portaria e monitoramento" }
  ]
}
</script>
</head>

<body class="preload">
  <!-- Atalho de acessibilidade: primeiro elemento focável -->
  <a class="skip-link" href="#hero">Ir para o conteúdo</a>

  <!-- Barra de progresso de leitura (topo, 2px) -->
  <div class="barra-progresso" aria-hidden="true">
    <span class="barra-progresso__fill" id="progresso-fill"></span>
  </div>

  <!-- =====================================================================
       PALCO FIXO — camadas independentes e pointer-events: none.
       Toda a experiência visual (fundo, vidro de TV) vive aqui.
       O conteúdo textual fica no fluxo normal, acima, dentro de #conteudo.
       ===================================================================== -->
  <div class="palco" id="palco" aria-hidden="true">
    <canvas class="palco__fundo" id="fundo-canvas"></canvas>
    <div class="palco__tela-video" id="palco-video"></div>
    <div class="palco__grade-video" id="palco-grade"></div>
    <div class="palco__vidro vidro" id="vidro"></div>
    <div class="palco__vinheta" id="vinheta"></div>
  </div>

  <!-- =====================================================================
       CONTEÚDO — fluxo normal de documento (SEO + acessibilidade).

       IMPORTANTE: este bloco tem ALTURA FIXA (config.scroll.alturaTotalSvh).
       É ele que define a "régua" da narrativa. As seções de conteúdo denso
       (Fases 2 e 3) ficam FORA dele, logo abaixo, em fluxo normal — assim a
       narrativa termina exatamente quando a última seção começa a aparecer.
       ===================================================================== -->
  <main class="conteudo" id="conteudo">

    <!-- 1. HERO ---------------------------------------------------------- -->
    <section class="secao hero" id="hero">
      <div class="hero__bg" id="hero-bg" aria-hidden="true">
        <img src="/media/img/hero-lago.webp" alt="Lago do Paraíso das Águas" class="hero__bg-img" id="hero-bg-img" width="1280" height="720" fetchpriority="high">
        <div class="hero__bg-overlay"></div>
      </div>

      <div class="hero__inner">
        <div class="hero__wordmark-caixa">
          <span class="hero__wordmark">Paraíso das Águas</span>
          <span class="hero__wordmark-sub">SÃO JOSÉ DOS CAMPOS</span>
        </div>

        <h1 class="hero__headline" id="hero-headline">
          Seu paraíso de <em>2 hectares</em> com lago, água mineral e segurança
        </h1>

        <p class="hero__sub" id="hero-sub">
          a 20 minutos do centro de São José dos Campos
        </p>

        <ul class="hero__selos" id="hero-selos" aria-label="Principais condições"></ul>

        <div class="hero__acoes">
          <a class="btn btn--ouro" id="hero-cta-primario" href="#" data-wa-origem="hero" rel="noopener">
            <span class="btn__icone" aria-hidden="true"></span>
            Agendar visita no WhatsApp
          </a>
          <a class="btn btn--vidro" id="hero-cta-secundario" href="#prova-rapida">
            Ver as chácaras disponíveis
          </a>
        </div>
      </div>

      <!-- Aviso "Deslize para baixo" -->
      <div class="dica" id="dica" role="status">
        <span class="dica__texto" id="dica-texto">Deslize para baixo e descubra o paraíso</span>
        <span class="dica__gesto" aria-hidden="true">
          <span class="dica__dedo"></span>
          <span class="dica__seta"></span>
        </span>
      </div>
    </section>

    <!-- CENA NARRATIVA DEDICADA: Palco sticky para os textos 3D -->
    <section class="secao-cenas" id="secao-cenas">
      <div class="cenas-palco" id="cenas-palco">
        <div class="carrossel" id="carrossel" data-ativo="false" aria-hidden="true"></div>
      </div>
    </section>

  </main>

  <!-- =====================================================================
       ESPAÇADOR — reserva no fluxo a altura das seções densas
       ===================================================================== -->
  <div class="espacador-secoes" aria-hidden="true"></div>

  <!-- =====================================================================
       SEÇÕES DE CONTEÚDO DENSO — fluxo normal, sem animação de scroll.
       Legíveis, indexáveis e com painel escuro semitransparente.
       ===================================================================== -->
  <div class="secoes" id="secoes">

    <!-- 2. PROVA RÁPIDA -->
    <section class="secao secao--painel" id="prova-rapida" hidden></section>

    <!-- 3. VSL (TV que liga) chega na Fase 3 -->
    <section class="secao secao--painel" id="vsl" hidden></section>

    <!-- 4. O PARAÍSO -->
    <section class="secao secao--painel secao--densa" id="o-paraiso" hidden></section>

    <!-- 5. LOCALIZAÇÃO E DISTÂNCIAS -->
    <section class="secao secao--painel secao--densa" id="localizacao" hidden></section>

    <!-- 6. COMUNIDADE E SEGURANÇA -->
    <section class="secao secao--painel secao--densa" id="comunidade" hidden></section>

    <!-- 7. VIDA NA CHÁCARA -->
    <section class="secao secao--painel secao--densa" id="vida-na-chacara" hidden></section>

    <!-- 8. VISÃO 3D / DRONE -->
    <section class="secao secao--painel secao--densa" id="visao-3d" hidden></section>

    <!-- 9. CHÁCARAS DISPONÍVEIS (A–G) -->
    <section class="secao secao--painel secao--densa" id="chacaras" hidden></section>

    <!-- 10. VÍDEOS 2×2 COM ABERTURA "LINHA DE BAMBU" -->
    <section class="secao secao--painel secao--densa" id="videos" hidden></section>

    <!-- 11. FAQ -->
    <section class="secao secao--painel secao--densa" id="faq" hidden></section>

    <!-- 12. CTA FINAL -->
    <section class="secao secao--painel secao--densa" id="cta-final" hidden></section>

  </div>

  <!-- =====================================================================
       RODAPÉ — fora de .secoes de propósito: é o fim do documento, não uma
       seção da narrativa.
       ===================================================================== -->
  <footer class="rodape" id="rodape"></footer>

  <!-- =====================================================================
       BOTÃO FLUTUANTE DE WHATSAPP — arrastável, com pulso constante.
       ===================================================================== -->
  <a class="wa-flutuante" id="wa-flutuante" href="#" data-wa-origem="flutuante"
     aria-label="Falar no WhatsApp e agendar visita" rel="noopener">
    <span class="wa-flutuante__anel" aria-hidden="true"></span>
    <svg class="wa-flutuante__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.3 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 1.9 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/>
      <path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.3c1.4.8 3 1.3 4.7 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.1c-1.5 0-3-.4-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3C4.2 15 3.8 13.5 3.8 12 3.8 7.5 7.5 3.8 12 3.8s8.2 3.7 8.2 8.2-3.7 8.1-8.2 8.1z"/>
    </svg>
    <span class="wa-flutuante__rotulo" aria-hidden="true">Agendar visita</span>
  </a>

  <!-- Módulos de escurecimento (política de privacidade / cookies) → Fase 4 -->

  <script type="module" src="/src/main.js"></script>
</body>
</html>
