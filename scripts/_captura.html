<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>captura</title>
<style>
  html,body{margin:0;background:#000}
  /* O iframe fica no tamanho exato do aparelho: o --screenshot captura só ele */
  iframe{border:0;display:block}
</style>
</head>
<body>
<script>
/* Ferramenta de captura: carrega o site em um iframe do tamanho exato de um
   aparelho, rola até a fração pedida e deixa assim para o Chrome fotografar.
   Uso: /_captura.html?w=390&h=844&p=0.35  (p = progresso da página, 0 a 1) */
const q = new URLSearchParams(location.search);
const largura = Number(q.get('w') || 390);
const altura = Number(q.get('h') || 844);
const fracao = Number(q.get('p') || 0);

const f = document.createElement('iframe');
f.width = largura;
f.height = altura;
f.style.width = largura + 'px';
f.style.height = altura + 'px';
f.src = '/index.html';
document.body.appendChild(f);

window.addEventListener('load', () => {
  setTimeout(() => {
    try {
      const w = f.contentWindow, d = f.contentDocument;
      const rolavel = Math.max(0, d.documentElement.scrollHeight - w.innerHeight);
      if (fracao > 0) {
        w.scrollTo(0, Math.round(rolavel * fracao));
        // Avisa o ciclo de animação do site que a posição mudou.
        w.dispatchEvent(new Event('scroll'));
      }
    } catch (e) { /* ignora */ }
  }, 2600);
});
</script>
</body></html>
